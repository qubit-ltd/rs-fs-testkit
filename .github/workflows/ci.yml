name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

jobs:
  dependency-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: qubit-ltd/rs-dependency-policy/.github/actions/check@39895c60b725068b7a72dc14d0ae18ee60c30e46

  rust-ci:
    uses: qubit-ltd/rs-local-files/.github/workflows/repository-ci.yml@main
    with:
      repository: rs-fs-testkit
      revision: ${{ github.event.pull_request.head.sha || github.sha }}
    secrets: inherit
