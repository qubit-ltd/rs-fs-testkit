name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

jobs:
  rust-ci:
    uses: qubit-ltd/rs-local-files/.github/workflows/repository-ci.yml@main
    with:
      repository: rs-fs-testkit
      revision: ${{ github.event.pull_request.head.sha || github.sha }}
    secrets: inherit
