[package]
name = "qubit-fs-s3-contract"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
qubit-fs = { path = "../../../rs-fs", default-features = false, features = ["async"] }
qubit-io = "0.16"
object_store = { version = "=0.14.1", features = ["aws"] }
bytes = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
