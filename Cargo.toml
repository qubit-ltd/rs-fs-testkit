[package]
name = "qubit-fs-testkit"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-fs-testkit"
description = "Reusable provider contract checks for qubit-fs implementations"
homepage = "https://github.com/qubit-ltd/rs-fs-testkit"
documentation = "https://docs.rs/qubit-fs-testkit"
readme = "README.md"
include = [
  "/Cargo.toml",
  "/LICENSE",
  "/README.md",
  "/README.zh_CN.md",
  "/doc/file_system_testkit_design.zh_CN.md",
  "/doc/user_guide.md",
  "/doc/user_guide.zh_CN.md",
  "/src/**",
  "/tests/**",
]
keywords = ["filesystem", "testing", "testkit", "contract", "qubit"]
categories = ["development-tools::testing", "filesystem"]

[lib]
name = "qubit_fs_testkit"
doctest = true

[features]
default = []
async = ["qubit-fs/async"]

[dependencies]
qubit-fs = { path = "../rs-fs", version = "0.2", default-features = false }
qubit-io = "0.15"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
